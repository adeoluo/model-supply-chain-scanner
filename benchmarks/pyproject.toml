[project]
name = "msscan-benchmarks"
version = "0.1.0"
description = "Corpus builders and the comparison harness for model-supply-chain-scanner"
requires-python = ">=3.12,<3.13"
dependencies = [
    "model-supply-chain-scanner",
    "numpy>=1.26",
    "joblib>=1.4",
    "scikit-learn>=1.5",
    "torch>=2.4",
    "h5py>=3.11",
    "onnx>=1.17",
    "jinja2>=3.1",
    "gguf>=0.10",
    "safetensors>=0.4",
    "picklescan>=0.0.26",
    "modelscan>=0.8",
    "fickling>=0.1.3",
    "keras>=3.6",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6.100"]

[tool.uv]
package = false

[tool.uv.sources]
model-supply-chain-scanner = { path = "..", editable = false }
