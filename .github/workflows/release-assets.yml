name: Release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach assets to
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, wheel: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, wheel: true }
          - { os: macos-latest, target: aarch64-apple-darwin, wheel: true }
          - { os: macos-latest, target: x86_64-apple-darwin, wheel: false }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, wheel: true }
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build the binary
        run: cargo build --release --locked -p msscan --target ${{ matrix.target }}

      - name: Package the binary
        shell: bash
        run: |
          name="msscan-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          ext=""; [[ "${{ runner.os }}" == "Windows" ]] && ext=".exe"
          cp "target/${{ matrix.target }}/release/msscan$ext" LICENSE README.md "dist/$name/"
          cd dist
          if [[ "${{ runner.os }}" == "Windows" ]]; then 7z a -bd "$name.zip" "$name" > /dev/null; else tar czf "$name.tar.gz" "$name"; fi
          rm -rf "$name"

      - name: Build the wheel (abi3, Python 3.11 and later)
        if: matrix.wheel
        shell: bash
        run: uv build --wheel --python 3.12 --out-dir dist

      - name: Upload to the release
        shell: bash
        run: gh release upload "$TAG" dist/* --clobber

  checksums:
    name: SHA256SUMS
    runs-on: ubuntu-latest
    needs: build
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checksum every asset
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist --skip-existing
          cd dist && rm -f SHA256SUMS && sha256sum -- * > SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
