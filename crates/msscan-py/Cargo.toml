[package]
name = "msscan-py"
description = "Python bindings for msscan-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "msscan_rs"
crate-type = ["cdylib"]

[dependencies]
msscan-core = { path = "../msscan-core" }
pyo3 = { version = "0.30", features = ["abi3-py311", "extension-module"] }
