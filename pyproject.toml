[project]
name = "model-supply-chain-scanner"
version = "0.1.1"
description = "Scan machine learning model files for code execution and unsafe content before loading them"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Adeolu Ogunnoiki" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = []
keywords = ["security", "pickle", "pytorch", "safetensors", "gguf", "onnx", "keras", "supply-chain"]

[project.scripts]
msscan-py = "msscan.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.14",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "maturin>=1.7,<2",
]

[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

# The Rust core is compiled into the package as `msscan.msscan_rs`; the Python layer adds
# typed results, the command line and a reference pickle analyzer for parity tests.
[tool.maturin]
python-source = "src"
manifest-path = "crates/msscan-py/Cargo.toml"
module-name = "msscan.msscan_rs"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }, { file = "crates/**/Cargo.toml" }, { file = "crates/**/*.rs" }]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "benchmarks"]
extend-exclude = ["benchmarks/.venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "C4", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Embedded worker scripts and long fixture strings.
"benchmarks/**" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["msscan"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["msscan.msscan_rs"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["src"]
branch = true
